<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плотность и концентрация кислот</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 620px;
            width: 100%;
        }
        h1 { font-size: 22px; color: #1a3b5d; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #6b7c8f; font-size: 14px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; color: #2c3e50; margin-bottom: 6px; font-size: 14px; }
        select, input {
            width: 100%; padding: 10px 12px;
            border: 2px solid #d0dbe8; border-radius: 8px;
            font-size: 16px; outline: none; background: #fafcff;
            transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: #3a7bd5; }
        .row { margin-bottom: 15px; }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .input-grid .row { margin-bottom: 0; }
        .result-box {
            background: #eef6ff;
            border: 1px solid #c5ddf5;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 15px;
            color: #1a3b5d;
            line-height: 1.9;
        }
        .result-box .val { font-weight: bold; color: #1a6fc4; }
        .max-info {
            background: #fff8e6;
            border: 1px solid #f0dca0;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: 13px;
            color: #7a5c00;
            line-height: 1.6;
        }
        .source-info {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 14px;
            margin-top: 15px;
            font-size: 12px;
            color: #555;
            line-height: 1.7;
        }
        .source-info b { color: #333; }
        .source-info a {
            color: #1a6fc4;
            text-decoration: none;
            border-bottom: 1px dashed #1a6fc4;
        }
        .source-info a:hover {
            color: #135a9e;
            border-bottom-style: solid;
        }
        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #a0b0c0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Плотность растворов кислот</h1>
    <p class="subtitle">Введите любую из четырёх величин — остальные рассчитаются</p>

    <div class="row">
        <label for="acidSelect">Выберите кислоту</label>
        <select id="acidSelect" onchange="updateAcid()">
            <option value="hcl">Соляная кислота (HCl)</option>
            <option value="h2so4">Серная кислота (H₂SO₄)</option>
            <option value="hno3">Азотная кислота (HNO₃)</option>
            <option value="ch3cooh">Уксусная кислота (CH₃COOH)</option>
            <option value="h3po4">Ортофосфорная кислота (H₃PO₄)</option>
        </select>
    </div>

    <div class="input-grid">
        <div class="row">
            <label for="inpDensity">Плотность, г/мл</label>
            <input type="number" id="inpDensity" step="0.001" min="0" placeholder="например, 1.1" oninput="onInput('density')">
        </div>
        <div class="row">
            <label for="inpMass">Массовая доля, %</label>
            <input type="number" id="inpMass" step="0.01" min="0" placeholder="например, 20" oninput="onInput('mass')">
        </div>
        <div class="row">
            <label for="inpMolar">Концентрация, моль/л</label>
            <input type="number" id="inpMolar" step="0.001" min="0" placeholder="например, 6.0" oninput="onInput('molar')">
        </div>
        <div class="row">
            <label for="inpGl">Концентрация, г/л</label>
            <input type="number" id="inpGl" step="0.1" min="0" placeholder="например, 220" oninput="onInput('gl')">
        </div>
    </div>

    <div class="result-box" id="result">
        Введите значение в любое поле...
    </div>

    <div class="max-info" id="maxInfo"></div>
    <div class="source-info" id="sourceInfo"></div>
    <div class="footer">Справочные данные для растворов кислот</div>
</div>

                [1.009, 2, 0.184, 20.18], [1.020, 4, 0.408, 40.80], [1.025, 5, 0.523, 51.25],
                [1.031, 6, 0.631, 61.86], [1.042, 8, 0.851, 83.36], [1.054, 10, 1.076, 105.40],
                [1.066, 12, 1.305, 127.92], [1.083, 15, 1.658, 162.45], [1.115, 20, 2.276, 223.00],
                [1.182, 30, 3.618, 354.60], [1.255, 40, 5.122, 502.00], [1.336, 50, 6.816, 668.00],

    // Линейная интерполяция по плотности
    function interpolateByDensity(density, table) {
        if (density < table[0][0] || density > table[table.length - 1][0]) return null;
        for (let i = 0; i < table.length - 1; i++) {
            const p1 = table[i], p2 = table[i + 1];
            if (density >= p1[0] && density <= p2[0]) {
                const t = (density - p1[0]) / (p2[0] - p1[0]);
                return {
                    density: density,
                    mass:  p1[1] + t * (p2[1] - p1[1]),
                    molar: p1[2] + t * (p2[2] - p1[2]),
                    gl:    p1[3] + t * (p2[3] - p1[3])
                };
            }
        }
        return null;
    }

    // Поиск по любой величине
    function findByValue(value, field, table) {
        const idx = { density: 0, mass: 1, molar: 2, gl: 3 }[field];
        let best = null, bestDiff = Infinity;
        for (const row of table) {
            const diff = Math.abs(row[idx] - value);
            if (diff < bestDiff) { bestDiff = diff; best = row; }
        }
        const range = table[table.length - 1][idx] - table[0][idx];
        if (bestDiff > range * 0.2) return null;
        return {
            density: best[0],
            mass: best[1],
            molar: best[2],
            gl: best[3]
        };
    }

    // Обновление при смене кислоты
    function updateAcid() {
        const acid = acidData[document.getElementById('acidSelect').value];
        document.getElementById('maxInfo').innerHTML =
            `<b>Максимальная концентрация:</b> ${acid.maxConc}`;

        let srcHtml = `<b>Источник данных:</b> ${acid.sourceName}`;
        if (acid.sourceUrl) {
            srcHtml += ` — <a href="${acid.sourceUrl}" target="_blank" rel="noopener noreferrer">перейти к источнику</a>`;
        }
        if (acid.sourceNote) {
            srcHtml += `<br><i>Примечание: ${acid.sourceNote}</i>`;
        }
        document.getElementById('sourceInfo').innerHTML = srcHtml;

        clearInputs();
        document.getElementById('result').innerHTML = 'Введите значение в любое поле...';
    }

    function clearInputs() {
        ['inpDensity', 'inpMass', 'inpMolar', 'inpGl'].forEach(id => {
            document.getElementById(id).value = '';
        });
    }

    // Обработка ввода в любое поле
    function onInput(field) {
        const acidKey = document.getElementById('acidSelect').value;
        const acid = acidData[acidKey];
        const inputEl = document.getElementById({density:'inpDensity', mass:'inpMass', molar:'inpMolar', gl:'inpGl'}[field]);
        const raw = parseFloat(inputEl.value);

        const resultBox = document.getElementById('result');

        if (isNaN(raw) || raw <= 0) {
            resultBox.innerHTML = 'Введите корректное положительное число.';
            return;
        }

        let res;
        if (field === 'density') {
            res = interpolateByDensity(raw, acid.table);
        } else {
            res = findByValue(raw, field, acid.table);
        }

        if (!res) {
            const minD = acid.table[0][0].toFixed(3);
            const maxD = acid.table[acid.table.length - 1][0].toFixed(3);
            resultBox.innerHTML = `<span style="color:#c0392b;">Значение вне диапазона таблицы (плотность ${minD}–${maxD} г/мл).</span>`;
            return;
        }

        const setVal = (id, v) => { document.getElementById(id).value = v; };
        if (field !== 'density') setVal('inpDensity', res.density.toFixed(4));
        if (field !== 'mass')    setVal('inpMass', res.mass.toFixed(3));
        if (field !== 'molar')   setVal('inpMolar', res.molar.toFixed(4));
        if (field !== 'gl')      setVal('inpGl', res.gl.toFixed(2));

        resultBox.innerHTML = `
            <div>плотность, г/мл: <span class="val">${res.density.toFixed(4)}</span></div>
            <div>массовая доля, %: <span class="val">${res.mass.toFixed(3)}</span></div>
            <div>концентрация, моль/л: <span class="val">${res.molar.toFixed(4)}</span></div>
            <div>концентрация, г/л: <span class="val">${res.gl.toFixed(2)}</span></div>
        `;
    }

    // Инициализация
    window.addEventListener('DOMContentLoaded', updateAcid);
</script>
