<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плотность и концентрация кислот</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 620px;
            width: 100%;
        }
        h1 { font-size: 22px; color: #1a3b5d; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #6b7c8f; font-size: 14px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; color: #2c3e50; margin-bottom: 6px; font-size: 14px; }
        select, input {
            width: 100%; padding: 10px 12px;
            border: 2px solid #d0dbe8; border-radius: 8px;
            font-size: 16px; outline: none; background: #fafcff;
            transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: #3a7bd5; }
        .row { margin-bottom: 15px; }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .input-grid .row { margin-bottom: 0; }
        .result-box {
            background: #eef6ff;
            border: 1px solid #c5ddf5;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 15px;
            color: #1a3b5d;
            line-height: 1.9;
        }
        .result-box .val { font-weight: bold; color: #1a6fc4; }
        .max-info {
            background: #fff8e6;
            border: 1px solid #f0dca0;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: 13px;
            color: #7a5c00;
            line-height: 1.6;
        }
        .source-info {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 14px;
            margin-top: 15px;
            font-size: 12px;
            color: #555;
            line-height: 1.7;
        }
        .source-info b { color: #333; }
        .source-info a {
            color: #1a6fc4;
            text-decoration: none;
            border-bottom: 1px dashed #1a6fc4;
        }
        .source-info a:hover {
            color: #135a9e;
            border-bottom-style: solid;
        }
        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #a0b0c0; }

        @media (max-width: 480px) {
            body { padding: 15px 10px; }
            .container { padding: 20px 15px; border-radius: 8px; }
            h1 { font-size: 19px; }
            .subtitle { font-size: 13px; }
            .input-grid { grid-template-columns: 1fr; gap: 12px; }
            input, select { font-size: 16px; padding: 12px; }
            .result-box { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Плотность растворов кислот</h1>
    <p class="subtitle">Введите значение в любое поле — остальные рассчитаются</p>

    <div class="row">
        <label for="acidSelect">Выберите кислоту</label>
        <select id="acidSelect" onchange="updateAcid()">
            <option value="hcl">Соляная кислота (HCl)</option>
            <option value="h2so4">Серная кислота (H₂SO₄)</option>
            <option value="hno3">Азотная кислота (HNO₃)</option>
            <option value="ch3cooh">Уксусная кислота (CH₃COOH)</option>
            <option value="h3po4">Ортофосфорная кислота (H₃PO₄)</option>
        </select>
    </div>

    <div class="input-grid">
        <div class="row">
            <label for="inpDensity">Плотность, г/мл</label>
            <input type="number" id="inpDensity" step="0.0001" min="0" placeholder="например, 1.1"
                   onfocus="clearOthers('density')" oninput="onInput('density')">
        </div>
        <div class="row">
            <label for="inpMass">Массовая доля, %</label>
            <input type="number" id="inpMass" step="0.01" min="0" placeholder="например, 20"
                   onfocus="clearOthers('mass')" oninput="onInput('mass')">
        </div>
        <div class="row">
            <label for="inpMolar">Концентрация, моль/л</label>
            <input type="number" id="inpMolar" step="0.0001" min="0" placeholder="например, 6.0"
                   onfocus="clearOthers('molar')" oninput="onInput('molar')">
        </div>
        <div class="row">
            <label for="inpGl">Концентрация, г/л</label>
            <input type="number" id="inpGl" step="0.01" min="0" placeholder="например, 220"
                   onfocus="clearOthers('gl')" oninput="onInput('gl')">
        </div>
    </div>

    <div class="result-box" id="result">
        Введите значение в любое поле...
    </div>

    <div class="max-info" id="maxInfo"></div>
    <div class="source-info" id="sourceInfo"></div>
    <div class="footer">Справочные данные для растворов кислот</div>
</div>

    // Флаг, чтобы не запускать пересчёт, когда мы сами записываем значения в поля
    let updating = false;

    function interpolateByDensity(density, table) {
        if (density < table[0][0] || density > table[table.length - 1][0]) return null;
        for (let i = 0; i < table.length - 1; i++) {
            const p1 = table[i], p2 = table[i + 1];
            if (density >= p1[0] && density <= p2[0]) {
                const t = (p1[0] === p2[0]) ? 0 : (density - p1[0]) / (p2[0] - p1[0]);
                return {
                    density: density,
                    mass:  p1[1] + t * (p2[1] - p1[1]),
                    gl:    p1[2] + t * (p2[2] - p1[2]),
                    molar: p1[3] + t * (p2[3] - p1[3])
                };
            }
        }
        return null;
    }

    function findByValue(value, field, table) {
        const idx = { density: 0, mass: 1, gl: 2, molar: 3 }[field];
        let best = null, bestDiff = Infinity;
        for (const row of table) {
            const diff = Math.abs(row[idx] - value);
            if (diff < bestDiff) { bestDiff = diff; best = row; }
        }
        const range = table[table.length - 1][idx] - table[0][idx];
        if (range === 0) return null;
        if (bestDiff > range * 0.2) return null;
        return { density: best[0], mass: best[1], gl: best[2], molar: best[3] };
    }

    function updateAcid() {
        const acid = acidData[document.getElementById('acidSelect').value];
        document.getElementById('maxInfo').innerHTML =
            `<b>Максимальная концентрация:</b> ${acid.maxConc}`;

        let srcHtml = `<b>Источник данных:</b> ${acid.sourceName}`;
        if (acid.sourceUrl) {
            srcHtml += ` — <a href="${acid.sourceUrl}" target="_blank" rel="noopener noreferrer">перейти к источнику</a>`;
        }
        if (acid.sourceNote) {
            srcHtml += `<br><i>Примечание: ${acid.sourceNote}</i>`;
        }
        document.getElementById('sourceInfo').innerHTML = srcHtml;

        clearAllInputs();
        document.getElementById('result').innerHTML = 'Введите значение в любое поле...';
    }

    function clearAllInputs() {
        updating = true;
        ['inpDensity', 'inpMass', 'inpMolar', 'inpGl'].forEach(id => {
            document.getElementById(id).value = '';
        });
        updating = false;
    }

    // Очистка других полей при фокусе на одном из них
    function clearOthers(currentField) {
        const ids = { density: 'inpDensity', mass: 'inpMass', molar: 'inpMolar', gl: 'inpGl' };
        updating = true;
        Object.keys(ids).forEach(key => {
            if (key !== currentField) {
                document.getElementById(ids[key]).value = '';
            }
        });
        updating = false;
    }

    function onInput(field) {
        if (updating) return;

        const acidKey = document.getElementById('acidSelect').value;
        const acid = acidData[acidKey];
        const inputEl = document.getElementById({density:'inpDensity', mass:'inpMass', molar:'inpMolar', gl:'inpGl'}[field]);
        const raw = parseFloat(inputEl.value);
        const resultBox = document.getElementById('result');

        if (isNaN(raw)) {
            resultBox.innerHTML = 'Введите значение в любое поле...';
            return;
        }
        if (raw < 0) {
            resultBox.innerHTML = '<span style="color:#c0392b;">Значение должно быть неотрицательным.</span>';
            return;
        }

        let res;
        if (field === 'density') {
            res = interpolateByDensity(raw, acid.table);
        } else {
            res = findByValue(raw, field, acid.table);
        }

        if (!res) {
            const minD = acid.table[0][0].toFixed(4);
            const maxD = acid.table[acid.table.length - 1][0].toFixed(4);
            resultBox.innerHTML = `<span style="color:#c0392b;">Значение вне диапазона таблицы (плотность ${minD}–${maxD} г/мл).</span>`;
            return;
        }

        // Записываем значения только в остальные поля, не трогая то, куда вводит пользователь
        updating = true;
        if (field !== 'density') document.getElementById('inpDensity').value = res.density.toFixed(4);
        if (field !== 'mass')    document.getElementById('inpMass').value    = res.mass.toFixed(2);
        if (field !== 'molar')   document.getElementById('inpMolar').value   = res.molar.toFixed(4);
        if (field !== 'gl')      document.getElementById('inpGl').value      = res.gl.toFixed(2);
        updating = false;

        resultBox.innerHTML = `
            <div>плотность, г/мл: <span class="val">${res.density.toFixed(4)}</span></div>
            <div>массовая доля, %: <span class="val">${res.mass.toFixed(2)}</span></div>
            <div>концентрация, моль/л: <span class="val">${res.molar.toFixed(4)}</span></div>
            <div>концентрация, г/л: <span class="val">${res.gl.toFixed(2)}</span></div>
        `;
    }
